name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-15-intel
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system media tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr tesseract-ocr-eng tesseract-ocr-vie
      - name: Install system media tools on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg tesseract
      - run: python -m pip install '.[test,mcp,interop]'
      - run: python -m pytest -q -ra
      - run: ruff check .
      - run: python tools/check_repository.py
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
