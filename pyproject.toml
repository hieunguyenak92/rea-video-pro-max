[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-video-pro-max"
version = "0.1.1"
description = "Reverse-engineer video editing into evidence, timelines and reusable styles; render new content."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["Pillow>=11,<13", "numpy>=2,<3", "av>=14,<18"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
interop = ["opentimelineio>=0.18,<0.20"]
asr = ["faster-whisper>=1.2.1,<2"]
test = ["pytest>=8,<10", "ruff>=0.14", "jsonschema>=4.20"]

[project.scripts]
rea-video-pro-max = "rea_video_pro_max.cli:main"
rea-video-pro-max-mcp = "rea_video_pro_max.mcp_server:main"

[tool.setuptools.packages.find]
where = ["skills/rea-video-pro-max/lib"]

[tool.setuptools.package-data]
rea_video_pro_max = ["schemas/*.json", "resources/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
